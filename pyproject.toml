[project]
name = "logs"
version = "0.4.0"
description = "Log scraping, ruleset extraction, and extract builder CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.9.2,<1",
]

[project.scripts]
logs = "logs.cli:main"

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
