[project]
name = "logs"
version = "0.7.0"
description = "Log extract desktop app with Policywise-style Excel export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3,<3",
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "python-multipart>=0.0.20,<1",
]
desktop = []
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.9.2,<1",
    "httpx>=0.28.0,<1",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "python-multipart>=0.0.20,<1",
    "pyinstaller>=6.11.0,<7",
]

[project.scripts]
logs = "logs.cli:main"
logs-desktop = "logs.desktop.app:main"
logs-gui = "logs.web.server:main"

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logs = ["web/static/*", "web/templates/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
